name: educacao_analytics
version: "1.0.0"
config-version: 2

profile: educacao_analytics

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

clean-targets: ["target", "dbt_packages"]

vars:
  # Data "de hoje" dos dados sintéticos. Fixa para os resultados serem reprodutíveis.
  data_referencia: "2026-10-20"
  ano_letivo_atual: 2026
  # Quantos dias o model incremental reprocessa para pegar eventos que chegam atrasados.
  dias_reprocessamento_incremental: 3

seeds:
  educacao_analytics:
    # Simula a camada de pouso (landing) que, em produção, viria de uma ferramenta de ingestão.
    raw:
      +schema: raw
    # Dados de referência estáveis: o uso "de verdade" de seeds.
    referencia:
      +schema: referencia

models:
  educacao_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
